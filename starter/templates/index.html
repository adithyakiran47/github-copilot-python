<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="check-solution">Check</button>
    <button id="hint">Hint</button>
    <span>Hints: <span id="hint-count">0</span></span>
    <span id="timer">00:00</span>
    <span id="message"></span>
  </div>
  <div id="score-entry" hidden>
    <label for="score-name">Name</label>
    <input id="score-name" type="text" maxlength="20">
    <button id="save-score">Save</button>
  </div>
  <section class="scoreboard" aria-labelledby="scoreboard-heading">
    <h2 id="scoreboard-heading">Top 10</h2>
    <table>
      <thead>
        <tr><th>Rank</th><th>Name</th><th>Time</th><th>Difficulty</th><th>Hints</th></tr>
      </thead>
      <tbody id="scoreboard-body"></tbody>
    </table>
    <p id="scoreboard-status" role="status"></p>
  </section>
  <script src="/static/scoreboard.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
